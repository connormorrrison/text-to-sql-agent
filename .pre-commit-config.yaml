# pre-commit is a backend dev dependency. Install hooks with `make install`.
# Run on everything with: uv run --project backend pre-commit run --all-files
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1  # keep in sync with ruff in backend/uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # mypy runs from the backend's uv environment so it sees the real dependencies.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend, strict)
        entry: uv run --directory backend mypy
        language: system
        files: ^backend/(src|scripts)/.*\.py$
        pass_filenames: false

      # Commit messages must never mention Claude (no AI co-author trailers or references).
      # Ignores git comments, the `git commit -v` diff, and `.claude/` paths. See the script.
      # --project (not --directory) keeps the repo root as cwd, so the message path resolves.
      - id: no-claude-in-commit-msg
        name: commit message does not mention Claude
        entry: uv run --project backend python backend/scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
