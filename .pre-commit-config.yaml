# Install hooks once with: pre-commit install
# Run on everything with:  pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [commit]  # "commit" = the pre-commit stage; also valid on pre-commit < 3.2

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1  # keep in sync with ruff in backend/uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # mypy runs from the backend's uv environment so it sees the real dependencies.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend, strict)
        entry: uv run --directory backend mypy
        language: system
        files: ^backend/(src|scripts)/.*\.py$
        pass_filenames: false

      # Commit messages must never mention Claude (no AI co-author trailers or references).
      # Lines starting with '#' are git's editor comments and are ignored.
      - id: no-claude-in-commit-msg
        name: commit message does not mention Claude
        entry: '(?i)^(?!#).*claude'
        language: pygrep
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
